name: 构建与资源校验

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check -- --dist dist
      - name: 验证仓库子路径构建
        run: |
          npm run build -- --base /qingmingshanghetu/ --outDir .cache/pages-check
          npm run check -- --dist .cache/pages-check --base /qingmingshanghetu/
